[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obd2-mcp"
version = "0.1.0"
description = "MCP server for ELM327-compatible OBD-II adapters"
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.26,<2", "obd>=0.7.3,<0.8"]

[project.scripts]
obd2-mcp = "obd_mcp.server:main"

[tool.setuptools.packages.find]
include = ["obd_mcp*"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "obd.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
